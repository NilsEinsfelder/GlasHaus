# Pre-commit configuration for the GlasHaus project.
#
# This file defines the local quality gates that must pass before
# changes can be committed to the repository.

default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: python -m mypy backend/app
        language: system
        pass_filenames: false

      - id: pytest-unit
        name: pytest unit
        entry: pytest backend/tests/unit
        language: system
        pass_filenames: false