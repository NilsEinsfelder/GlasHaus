name: GlasHaus CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: glashaus
          POSTGRES_PASSWORD: glashaus
          POSTGRES_DB: glashaus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U glashaus -d glashaus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://glashaus:glashaus@localhost:5432/glashaus
      GLASHAUS_TEST_DATABASE_URL: postgresql+psycopg://glashaus:glashaus@localhost:5432/glashaus

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: MyPy
        run: mypy app

      - name: Alembic migration verification
        run: |
          alembic upgrade head
          alembic current
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Tests
        run: pytest

      - name: PostgreSQL integration tests
        run: pytest tests/integration/test_postgresql_migration.py -v --no-cov

      - name: Git diff check
        run: git diff --check